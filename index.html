<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Hochzeits Spiel — Quiz</title>
  <style>
    :root{
      --bg:#2b1d18;
      --fg:#ffffff;
      --accent:#84614f;
      --font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      --base-size: 28px;
    }
    html,body{height:100%;margin:0;font-family:var(--font-family);background:var(--bg);color:var(--fg);}
    /* full-viewport vertical sections with snap */
    main{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-y}
    section.card{height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;box-sizing:border-box;scroll-snap-align:start}
    .content{max-width:900px;text-align:center;transform:translateY(-8vh)}
    h1{font-size:calc(var(--base-size) * 1.6);line-height:1.05;margin:0 0 .5rem}
    p.lead{font-size:calc(var(--base-size) * 0.7);margin:0 0 1rem}
    .progress{position:fixed;left:8px;right:8px;top:8px;height:8px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden}
    .progress > i{display:block;height:100%;background:var(--accent);width:0%}
    .footer-actions{position:fixed;right:12px;bottom:12px;display:flex;gap:8px}
    button.icon{background:var(--accent);border:none;color:#000;padding:.8rem;border-radius:10px;font-size:18px}
    button.toggle{background:var(--accent);border:2px solid var(--accent);color:var(--fg);padding:.6rem;border-radius:10px;font-size:16px}
    button.icon:focus{outline:3px solid #fff}
    .instructions{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,0.45);padding:10px;border-radius:8px;font-size:14px}
    /* settings overlay */
    .settings{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center}
    .settings .panel{background:#fff;color:#000;padding:18px;border-radius:12px;max-width:520px;width:100%}
    .field{margin-bottom:12px}
    label{display:block;font-weight:600;margin-bottom:6px}
    input[type=color], select, input[type=range], textarea, input[type=number]{width:100%}
    textarea{height:160px;font-size:14px}
    .btn-row{display:flex;gap:8px;justify-content:flex-end}
    .sr-only{position:absolute;left:-9999px}
    /* high contrast defaults for cards */
    section.card{background:transparent}
    /* focus styles */
    section.card:focus{outline:4px solid var(--accent)}
    @media (max-width:600px){:root{--base-size:22px} h1{font-size:calc(var(--base-size) * 1.6)}}
    /* start screen */
    section.start{height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:12vh 0 0 0;margin:0;scroll-snap-align:start;background-image:linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)), url('start.jpg');background-size:cover;background-position:top center;color:var(--fg);}
    .start .start-inner{max-width:900px;text-align:center;padding:2rem}
    .start h2{font-size:calc(var(--base-size) * 1.6);margin-bottom:1rem}
    .start button{font-size:calc(var(--base-size) * 0.7);padding:1rem 1.5rem;border-radius:10px;border:none;background:var(--accent);color:#fff}
    /* in dark mode (no .light class) make Start text dark for contrast on light accent */
    :root:not(.light) .start button { color: #000 }
    .light { --bg: #f0d3c5; --fg: #000000; }
  </style>
</head>
<body>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  <main id="deck" role="list">
    <!-- sections injected by JS -->
  </main>

  <div class="instructions" aria-hidden="false">Wischen für nächste Frage</div>
  <div class="footer-actions">
    <button id="homeBtn" class="toggle" title="Startseite">🏠</button>
    <button id="themeBtn" class="toggle" aria-pressed="false" title="Heller/Dunkler Modus">🌙</button>
    <button id="settingsBtn" class="icon" aria-haspopup="dialog" aria-controls="settingsPanel">⚙️</button>
  </div>

  <div id="settings" class="settings" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="panel" id="settingsPanel">
      <h2>Anzeige & Fragen konfigurieren</h2>
      <!-- Farbwahl entfernt: Farben werden per Theme/Defaults verwaltet -->
      <div class="field"><label for="questionsInput">Test-Fragen (eine pro Zeile)</label><textarea id="questionsInput" aria-label="Test Fragen"></textarea></div>
      <div class="field"><label for="fontSelect">Schriftart</label><select id="fontSelect"><option value="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial">Sans-Serif</option><option value="Georgia, 'Times New Roman', Times, serif">Serif</option><option value="Menlo, Monaco, 'Courier New', monospace">Monospace</option></select></div>
      <div class="field"><label for="fontSize">Basis-Schriftgröße: <span id="fontSizeVal"></span></label><input id="fontSize" type="range" min="18" max="48" step="1"></div>
      <div class="btn-row">
        <button id="resetBtn" class="icon" style="background:#eee">Zurücksetzen</button>
        <button id="saveBtn" class="icon" style="background:#9be7a9">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    // Default configuration and dummy questions (10)
    const defaultState = {
      bg:'#2b1d18',
      fg:'#ffffff',
      accent:'#84614f',
      font:"Georgia, 'Times New Roman', Times, serif",
      baseSize:32,
      isLight:true,
      questions:[
        'Wer ist mit der Braut verwandt?',
        'Wer hat die Braut aufwachsen sehen?',
        'Wer hat dem Brautpaar beim Umzug geholfen?',
        'Wer war mit dem Bräutigam in der Schulzeit?',
        'Wer hat heute Geburtstag (oder fast)?',
        'Wer kann ein Gedicht für das Paar rezitieren?',
        'Wer hat das Paar verkuppelt?',
        'Wer ist von außerhalb angereist?',
        'Wer hat einen besonderen Tanz eingeübt?',
        'Wer war schon länger als 20 Jahre verheiratet?'
      ]
    };

    // load or init
    const persistedRaw = localStorage.getItem('hochzeit_state');
    const state = persistedRaw ? JSON.parse(persistedRaw) : JSON.parse(JSON.stringify(defaultState));

    const deck = document.getElementById('deck');
    const prog = document.getElementById('prog');
    const instructions = document.querySelector('.instructions');

    function applyTheme(){
      if(state.isLight){
        document.documentElement.classList.add('light');
          document.documentElement.style.setProperty('--bg', '#f0d3c5');
          document.documentElement.style.setProperty('--fg', '#000000');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.style.setProperty('--bg', state.bg === '#000000' ? '#2b1d18' : state.bg);
        document.documentElement.style.setProperty('--fg', state.fg);
      }
      // use a different accent in dark mode for contrast
      if(state.isLight){
        document.documentElement.style.setProperty('--accent', state.accent);
      } else {
        document.documentElement.style.setProperty('--accent', '#f0d3c5');
      }
      document.documentElement.style.setProperty('--font-family', state.font);
      document.documentElement.style.setProperty('--base-size', state.baseSize+'px');
      prog.style.width = '0%';
      const themeBtn = document.getElementById('themeBtn'); if(themeBtn) themeBtn.textContent = state.isLight ? '☀️' : '🌙';
    }

    function render(){
      deck.innerHTML = '';
      // start screen
      const start = document.createElement('section');
      start.className = 'start';
      start.setAttribute('role','region');
      start.setAttribute('aria-label','Startseite');
      start.innerHTML = `<div class="start-inner"><h2>Willkommen</h2><p style="opacity:.9;margin-bottom:1rem">Tippe auf Start, um die Fragen zu sehen</p><br /><br /><button id="startBtn">Start</button></div>`;
      deck.appendChild(start);

      const total = state.questions.length;
      state.questions.forEach((q,i)=>{
        const s = document.createElement('section');
        s.className = 'card';
        s.setAttribute('role','listitem');
        s.setAttribute('tabindex','0');
        s.setAttribute('aria-label',`Frage ${i+1} von ${total}`);
        s.innerHTML = `<div class="content"><h1>${escapeHtml(q)}</h1><p aria-hidden="true">—</p><p style="margin-top:1rem;font-size:calc(var(--base-size) * 0.6)">Frage ${i+1} / ${total}</p></div>`;
        deck.appendChild(s);
      });
      const end = document.createElement('section');
      end.className = 'start end';
      end.setAttribute('role','region');
      end.setAttribute('aria-label','Vielen Dank fürs Mitmachen');
      end.innerHTML = '<div class="start-inner"><h2>Vielen Dank fürs Mitmachen 🥳</h2></div>';
      deck.appendChild(end);
      // hook start button
      const startBtn = document.getElementById('startBtn');
      if(startBtn){startBtn.addEventListener('click', ()=>{goTo(0);});}
      updateProgress();
    }

    function escapeHtml(s){return (s+'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]||c;});}

    function updateProgress(){
      const all = Array.from(deck.querySelectorAll('section'));
      const cards = Array.from(deck.querySelectorAll('section.card'));
      const total = cards.length;
      let idx = 0;
      let minDist = Infinity;
      all.forEach((s,i)=>{
        const r = s.getBoundingClientRect();
        const dist = Math.abs(r.top);
        if(dist<minDist){minDist=dist;idx=i}
      });
      const closest = all[idx];
      let pct = 0;
      const isSpecialPage = closest && closest.classList && closest.classList.contains('start');
      instructions.hidden = isSpecialPage;
      instructions.setAttribute('aria-hidden', String(isSpecialPage));
      const lastQuestion = closest && closest.classList && closest.classList.contains('card') && cards.indexOf(closest) === cards.length - 1;
      instructions.textContent = lastQuestion ? 'Wischen für letzte Seite' : 'Wischen für nächste Seite';
      try{
        if(isSpecialPage){
          // start and end screens
          const position = closest.classList.contains('end') ? state.questions.length + 1 : 0;
          localStorage.setItem('hochzeit_pos', String(position));
          pct = closest.classList.contains('end') ? 100 : 0;
        } else {
          const cardIndex = cards.indexOf(closest);
          const saveIndex = (cardIndex >= 0) ? (cardIndex + 1) : 1;
          localStorage.setItem('hochzeit_pos', String(saveIndex));
          pct = Math.round(((saveIndex)/total) * 100);
        }
      }catch(e){}
      prog.style.width = pct+'%';
    }

    // scroll-snap will handle user gestures; keep keyboard navigation
    document.addEventListener('keydown', e=>{
      if(e.key==='ArrowDown' || e.key==='PageDown') go(1);
      if(e.key==='ArrowUp' || e.key==='PageUp') go(-1);
      if(e.key==='Home') goTo(0);
      if(e.key==='End') goToEnd();
    });

    function go(delta){
      const cards = Array.from(deck.querySelectorAll('section.card'));
      if(!cards.length) return;
      const slides = Array.from(deck.querySelectorAll('section.start, section.card'));
      const currentIndex = slides.findIndex(s=>Math.abs(s.getBoundingClientRect().top) < (window.innerHeight/2));
      const nextIndex = Math.max(0, Math.min(slides.length-1, (currentIndex===-1?0:currentIndex)+delta));
      slides[nextIndex].scrollIntoView({behavior:'smooth'});
      try{ localStorage.setItem('hochzeit_pos', String(nextIndex)); }catch(e){}
    }
    function goTo(i){const sections = Array.from(deck.querySelectorAll('section.card'));sections[Math.max(0,Math.min(sections.length-1,i))].scrollIntoView({behavior:'smooth'});}
    function goToEnd(){
      const end = deck.querySelector('section.end');
      if(end){ end.scrollIntoView({behavior:'smooth'}); try{ localStorage.setItem('hochzeit_pos', String(state.questions.length + 1)); }catch(e){} }
    }

    function goHome(){
      const start = deck.querySelector('section.start');
      if(start){ start.scrollIntoView({behavior:'smooth'}); try{ localStorage.setItem('hochzeit_pos','0'); }catch(e){} start.querySelector('button')?.focus(); }
    }

    // update progress on scroll with small debounce
    let scrollTimer = null;
    deck.addEventListener('scroll', ()=>{if(scrollTimer) clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{updateProgress()},80)});

    // simple touch swipe to jump to next/prev (support horizontal and vertical; left/up => next)
    let touchStartX = null, touchStartY = null;
    deck.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; });
    deck.addEventListener('touchend', e=>{
      if(touchStartX==null || touchStartY==null) return;
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const dx = endX - touchStartX;
      const dy = endY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);
      const threshold = 40;
      if(absDx > absDy){
        // horizontal swipe: left -> next, right -> prev
        if(dx < -threshold) go(1);
        else if(dx > threshold) go(-1);
      } else {
        // vertical swipe: up -> next, down -> prev
        if(dy < -threshold) go(1);
        else if(dy > threshold) go(-1);
      }
      touchStartX = touchStartY = null;
    });

    // Settings UI
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsEl = document.getElementById('settings');
    const questionsInput = document.getElementById('questionsInput');
    const fontSelect = document.getElementById('fontSelect');
    const fontSize = document.getElementById('fontSize');
    const fontSizeVal = document.getElementById('fontSizeVal');

    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');

    settingsBtn.addEventListener('click', ()=>openSettings());
    settingsEl.addEventListener('click', (e)=>{if(e.target===settingsEl) closeSettings();});
    const themeBtnEl = document.getElementById('themeBtn');
    if(themeBtnEl){ themeBtnEl.addEventListener('click', ()=>{ state.isLight = !state.isLight; localStorage.setItem('hochzeit_state', JSON.stringify(state)); applyTheme(); }); }
    const homeBtnEl = document.getElementById('homeBtn');
    if(homeBtnEl){ homeBtnEl.addEventListener('click', ()=>{ goHome(); }); }

    function openSettings(){
      questionsInput.value = (state.questions || []).join('\n');
      fontSelect.value = state.font;
      fontSize.value = state.baseSize;
      fontSizeVal.textContent = state.baseSize+'px';
      settingsEl.style.display = 'flex';
      settingsEl.setAttribute('aria-hidden','false');
      document.getElementById('settingsPanel').focus();
    }
    function closeSettings(){settingsEl.style.display='none';settingsEl.setAttribute('aria-hidden','true');settingsBtn.focus();}

    fontSize.addEventListener('input', ()=>{fontSizeVal.textContent = fontSize.value + 'px'});

    saveBtn.addEventListener('click', ()=>{
      // save test questions (one per line) into state for this user
      const qs = String(questionsInput.value || '').split('\n').map(s=>s.trim()).filter(Boolean);
      if(qs.length) state.questions = qs;
      state.font = fontSelect.value; state.baseSize = Number(fontSize.value);
      localStorage.setItem('hochzeit_state', JSON.stringify(state));
      applyTheme(); render(); closeSettings();
    });

    resetBtn.addEventListener('click', ()=>{
      localStorage.removeItem('hochzeit_state');
      Object.assign(state, JSON.parse(JSON.stringify(defaultState)));
      // try to reload questions from file as defaults
      fetchQuestionsFile().then(fileQs=>{ if(fileQs) state.questions = fileQs; applyTheme(); render(); closeSettings(); }).catch(()=>{ applyTheme(); render(); closeSettings(); });
    });

    // helper: fetch default questions from questions.txt
    function fetchQuestionsFile(){
      return fetch('questions.txt').then(r=>{ if(!r.ok) throw new Error('no'); return r.text() }).then(t=>t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)).catch(()=>null);
    }

    // init
    applyTheme(); render();
    // if there's no persisted questions, load from questions.txt
    fetchQuestionsFile().then(fileQs=>{
      if(fileQs && (!persistedRaw || !JSON.parse(persistedRaw).questions)){
        state.questions = fileQs;
        render();
      }
    }).catch(()=>{});
    // restore position from last session (if any) and focus appropriately
    window.addEventListener('load', ()=>{
      const pos = Number(localStorage.getItem('hochzeit_pos')||'0');
      setTimeout(()=>{
        if(pos && !isNaN(pos) && pos > 0){
          if(pos === state.questions.length + 1){
            goToEnd();
          } else {
            // scroll to that card
            goTo(pos-1);
            const cards = deck.querySelectorAll('section.card');
            const el = cards[pos-1]; if(el) el.focus();
          }
        } else {
          const start = deck.querySelector('section.start');
          if(start){ start.scrollIntoView(); start.querySelector('button')?.focus(); }
        }
      }, 120);
    });

    // Helpful note for QR code: index page is self-contained and works on S3
  </script>
</body>
</html>
